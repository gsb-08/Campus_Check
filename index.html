<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#173e37">
    <meta name="description" content="Manage class rosters, take attendance, and export reports with Campus Check.">
    <title>Campus Check</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <a class="skip-link" href="#app-content">Skip to content</a>

    <div class="app-shell">
      <aside class="sidebar" aria-label="Workspace">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
              <path d="M9 4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2H9zM9 13l2 2 4-4"/>
            </svg>
          </div>
          <div class="brand-text">
            <strong>Campus Check</strong>
            <span id="campus-short">VPKBIET</span>
          </div>
        </div>

        <nav class="workspace-nav" aria-label="Main navigation">
          <div class="nav-section">
            <div class="nav-section-label" aria-hidden="true">Workspace</div>
            <button type="button" class="nav-button" data-view="overview" aria-current="page">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.2"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.2"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.2"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.2"/></svg>
              <span>Overview</span>
            </button>
            <button type="button" class="nav-button" data-view="attendance">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5.5" width="16" height="15" rx="2"/><path d="M8 3.5v4m8-4v4m-12 3h16m-11 5 2 2 4-4"/></svg>
              <span>Attendance</span>
            </button>
            <button type="button" class="nav-button" data-view="reports">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5v14A1.5 1.5 0 0 0 5.5 20H20M9 15v-4m5 4V7m5 8V5"/></svg>
              <span>Reports</span>
            </button>
          </div>

          <div class="nav-section">
            <div class="nav-section-label" aria-hidden="true">Directory</div>
            <button type="button" class="nav-button" data-view="students">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 19v-1.4a4 4 0 0 1 4-4h3a4 4 0 0 1 4 4V19m1-13.9a3 3 0 0 1 0 5.8m2 3.05a4 4 0 0 1 3 3.9V19"/></svg>
              <span>Students</span>
            </button>
            <button type="button" class="nav-button" data-view="classes">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5.5h5a3.5 3.5 0 0 1 3.5 3.5v10a4.5 4.5 0 0 0-3.5-1.5h-5zm17 0h-5a3.5 3.5 0 0 0-3.5 3.5v10a4.5 4.5 0 0 1 3.5-1.5h5z"/></svg>
              <span>Classes</span>
            </button>
            <button type="button" class="nav-button" data-view="teachers">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="13" rx="1.5"/><path d="M9 20h6m-3-3v3m-4-7 3-3 2 2 3-4"/></svg>
              <span>Teachers</span>
            </button>
          </div>

          <div class="nav-section nav-section-settings">
            <button type="button" class="nav-button" data-view="settings">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h5m4 0h7M4 12h10m4 0h2M4 17h3m4 0h9"/><circle cx="11" cy="7" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="9" cy="17" r="2"/></svg>
              <span>Settings</span>
            </button>
          </div>
        </nav>

        <div class="workspace-status">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="mode-label">Demo workspace</span>
        </div>
      </aside>

      <div class="main-shell">
        <header class="topbar">
          <h1 id="page-title" class="page-title">Overview</h1>
          <div class="campus-context">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-5 9 5H3Zm2 11h14M7 12v4m5-4v4m5-4v4"/></svg>
            <span id="campus-name">Vidya Pratishthan’s Kamalnayan Bajaj Institute of Engineering and Technology, Baramati</span>
          </div>
        </header>

        <main id="app-content" class="main-content" tabindex="-1">
          <noscript><p class="callout">Enable JavaScript to use the attendance workspace.</p></noscript>
        </main>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
    <dialog id="dialog" class="dialog" aria-label="Workspace form"></dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
